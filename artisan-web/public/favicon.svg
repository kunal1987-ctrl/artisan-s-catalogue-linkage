<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <filter id="palette-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="8" flood-color="#180f0a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Artisan Wooden Palette Body -->
  <path d="M 230 40 C 370 40 465 130 465 250 C 465 330 410 390 350 400 C 310 407 270 380 250 350 C 230 320 190 320 170 350 C 140 395 80 430 40 370 C 5 320 20 230 50 160 C 90 70 160 40 230 40 Z" fill="#FDF8F3" stroke="#8B4513" stroke-width="14" stroke-linejoin="round" filter="url(#palette-shadow)" />

  <!-- Thumb Hole -->
  <ellipse cx="380" cy="270" rx="30" ry="42" fill="#FFFFFF" stroke="#8B4513" stroke-width="10" transform="rotate(-15 380 270)" />

  <!-- Traditional Craft Pigment Dollops -->
  <!-- 1. Terracotta Sindoor -->
  <circle cx="160" cy="110" r="32" fill="#C2410C" />
  <circle cx="150" cy="100" r="10" fill="#FDBA74" opacity="0.7" />

  <!-- 2. Turmeric Haldi Gold -->
  <circle cx="260" cy="90" r="30" fill="#EAB308" />
  <circle cx="250" cy="80" r="9" fill="#FEF08A" opacity="0.8" />

  <!-- 3. Neel Indigo Blue -->
  <circle cx="360" cy="130" r="30" fill="#1D4ED8" />
  <circle cx="350" cy="120" r="9" fill="#93C5FD" opacity="0.8" />

  <!-- 4. Forest Emerald Green -->
  <circle cx="100" cy="200" r="32" fill="#059669" />
  <circle cx="90" cy="190" r="10" fill="#6EE7B7" opacity="0.8" />

  <!-- 5. Madder Rose Berry -->
  <circle cx="95" cy="300" r="30" fill="#BE185D" />
  <circle cx="85" cy="290" r="9" fill="#F472B6" opacity="0.8" />

  <!-- Fine Craft Paintbrush -->
  <!-- Handle -->
  <path d="M 120 480 L 330 230 L 350 246 L 140 496 Z" fill="#78350F" stroke="#451A03" stroke-width="4" filter="url(#palette-shadow)" />
  <!-- Ferrule -->
  <path d="M 326 234 L 376 174 L 396 190 L 346 250 Z" fill="#CBD5E1" stroke="#64748B" stroke-width="4" />
  <!-- Bristles -->
  <path d="M 374 176 C 390 156 420 110 440 85 C 430 115 410 160 394 192 Z" fill="#D97706" stroke="#92400E" stroke-width="3" />
  <!-- Wet Paint on Tip -->
  <path d="M 415 115 C 428 98 440 85 440 85 C 440 85 432 105 423 122 Z" fill="#C2410C" />
</svg>
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <title>KalaSangam • Artisan Hub</title>
    <script>
      (function () {
        function isExtError(err) {
          if (!err) return false;
          var msg = String(err.message || err.name || err.reason || err).toLowerCase();
          var stack = String(err.stack || '').toLowerCase();
          return (
            msg.includes('writablefileappend') ||
            msg.includes('file_error_no_space') ||
            msg.includes('000188.ldb') ||
            msg.includes('.ldb') ||
            msg.includes('globals-front.js') ||
            msg.includes('content.js') ||
            stack.includes('chrome-extension://') ||
            stack.includes('moz-extension://') ||
            stack.includes('globals-front.js') ||
            stack.includes('content.js')
          );
        }
        window.addEventListener('unhandledrejection', function (e) {
          if (isExtError(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function (e) {
          if (isExtError(e.error) || isExtError(e.message)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
